<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Clients</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a id="nav-home" href="trainer_home.html" id="nav-home"><span data-i18n="nav-home"></span></a>
      <a id="nav-clients" class="active" href="clients.html" id="nav-clients"><span data-i18n="nav-clients"></span></a>
      <a id="nav-plans" href="plans.html" id="nav-plans"><span data-i18n="nav-plans"></span></a>
      <a id="nav-settings" href="settings.html" id="nav-settings"><span data-i18n="nav-settings"></span></a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="clients-header"><span data-i18n="clients-header"></span></div>
        <div class="card-sub" id="clients-subtext"><span data-i18n="clients-subtext"></span></div>
      </div>
      <div class="searchbar">
        <input id="search-input" type="search" class="input" placeholder="Search…" data-i18n-placeholder="search-placeholder" autocomplete="off" style="min-width: 220px; padding: 8px;" />
        <button id="search-clear" class="btn ghost" type="button" aria-label="Clear">✕</button>
        <select id="membership-filter" style="min-width: 120px; padding: 8px;">
          <option value="all" data-i18n="filter-all">All</option>
          <option value="active" data-i18n="filter-active">Active</option>
          <option value="inactive" data-i18n="filter-inactive">Inactive</option>
        </select>
        <a class="btn secondary" href="add_client.html" data-i18n="add">+ Add</a>
      </div>
    </div>
    <div id="client-list" class="grid cols-2"></div>
  </section>
</main>

<footer class="footer">Vita Clients</footer>
<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/theme.js"></script>
<script>
(function(){var b=(typeof window.API_BASE==='string'&&window.API_BASE)||location.origin;try{var u=new URL(b,location.href);b=u.origin;}catch(e){b=location.origin}window.API_BASE=String(b).replace(/\/+$/,'')})();
function buildApiUrl(p){return window.API_BASE.replace(/\/+$/,'')+p}
let allClients=[];
function clientCard(c){const a=c.membership_active;return `
    <div class="card" style="padding:16px">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <div class="status-dot ${a?'bg-ok':'bg-danger'}"></div>
          <strong style="font-size:1.05rem;margin-left:6px">${c.full_name||'—'}</strong>
        </div>
        <div class="row">
          <a class="btn ghost" href="client_detail.html?id=${c.id}">Details</a>
          <a class="btn ghost" href="client_plan.html?id=${c.id}">Plan</a>
        </div>
      </div>
      <div class="kv" style="margin-top:8px">
        <label>Email</label><div class="value">${c.email||'—'}</div>
        <label>Age</label><div class="value">${c.age??'—'}</div>
        <label>Weight</label><div class="value">${c.weight??'—'} kg</div>
        <label>Goal</label><div class="value">${c.goal||'—'}</div>
      </div>
    </div>`}
function render(list){
  const el=document.getElementById('client-list');
  if(!Array.isArray(list) || list.length===0){
    el.innerHTML = '<div class="card" style="padding:16px"><div class="card-sub">No clients match</div></div>';
    return;
  }
  el.innerHTML=list.map(clientCard).join('');
}
function normalize(v){ return (v||'').toString().toLowerCase().trim(); }
function matches(c,q){
  if(!q) return true;
  const fields=[c.full_name,c.email,c.phone,c.goal].map(normalize);
  return fields.some(f=>f.includes(q));
}
function filterNow(){
  const q=normalize(document.getElementById('search-input').value);
  const f=document.getElementById('membership-filter').value;
  const filtered=allClients.filter(c=>{
    const status = f==='all'||(f==='active'&&c.membership_active)||(f==='inactive'&&!c.membership_active);
    return status && matches(c,q);
  });
  render(filtered);
}
let tmr; function filterAndRender(){ clearTimeout(tmr); tmr=setTimeout(filterNow,150); }
document.addEventListener('DOMContentLoaded',async()=>{
  try{
    const res=await fetch(buildApiUrl('/api/clients/'));
    if(!res.ok)throw new Error('Load failed');
    allClients=await res.json();
    render(allClients)
  }catch(e){
    console.error(e);alert('❌ Failed to load clients')
  }
  document.getElementById('search-input').addEventListener('input',filterAndRender);
  document.getElementById('membership-filter').addEventListener('change',filterAndRender);
  const clr=document.getElementById('search-clear');
  if(clr){ clr.addEventListener('click',()=>{ const s=document.getElementById('search-input'); s.value=''; filterNow(); s.focus(); }); }
});
</script>
<script>function setLanguage(l){ I18N.switchLang(l, ['common','clients']); }</script>
<script>I18N.init(['common','clients']);</script>
</body></html>
