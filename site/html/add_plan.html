<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Add Plan</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a href="trainer_home.html">Home</a>
      <a href="clients.html">Clients</a>
      <a href="plans.html">Plans</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="add-plan-title">Create New Plan</div>
        <div class="card-sub">Define goal, type and description</div>
      </div>
    </div>
    <form id="add-plan-form">
      <div class="form-row cols-2">
        <div><label>Plan Name</label><input id="plan-name" required></div>
        <div>
          <label>Plan Type</label>
          <select id="plan-type" required>
            <option value="">Select a type</option>
            <option value="workout">Workout</option>
            <option value="meals">Meal Plan</option>
          </select>
        </div>
      </div>
      <div><label>Description</label><textarea id="plan-description" rows="5" placeholder="Short description…"></textarea></div>
      <div style="text-align:right"><button class="btn secondary" type="submit">Save Plan</button></div>
    </form>
  </section>
</main>

<script src="../js/lang.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/submit_plan.js"></script>
</body></html>
