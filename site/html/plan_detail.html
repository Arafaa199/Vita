<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="plan-detail-title" data-i18n="plan-detail.title">Vita · Plan Detail</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-title">
      <div class="card-title" id="plan-name-title" data-i18n="plan-detail.heading">Plan Detail</div>
      <div class="card-sub" data-i18n="plan-detail.sub">Edit plan name, description and type</div>
    </div>
    <div class="lang-toggle">
      <button class="btn ghost" onclick="setLanguage('en')">EN</button>
      <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
    </div>
  </header>

  <nav class="nav">
    <a id="nav-home" href="trainer_home.html"><span data-i18n="nav-home">Home</span></a>
    <a id="nav-clients" href="clients.html"><span data-i18n="nav-clients">Clients</span></a>
    <a id="nav-plans" class="active" href="plans.html"><span data-i18n="nav-plans">Plans</span></a>
    <a id="nav-settings" href="settings.html"><span data-i18n="nav-settings">Settings</span></a>
  </nav>

  <main class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;gap:12px">
        <a class="btn" id="btn-back" href="plans.html" data-i18n="common.back">⬅ Back</a>
        <div class="row" style="gap:12px;justify-content:flex-end">
          <button type="button" class="btn" id="saveButton" data-i18n="common.save">Save</button>
          <button type="button" class="btn danger" id="deleteButton" data-i18n="common.delete">Delete</button>
        </div>
      </div>

      <div class="grid" style="--cols:1; margin-top:16px">
        <label class="field">
          <span data-i18n="plan-detail.name">Plan Name</span>
          <input type="text" id="plan_name" placeholder="Plan Name" />
        </label>

        <label class="field">
          <span data-i18n="plan-detail.description">Description</span>
          <textarea id="plan_description" placeholder="Plan Description"></textarea>
        </label>

        <label class="field">
          <span data-i18n="plan-detail.type">Type</span>
          <select id="plan_type">
            <option value="workout" data-i18n="plan-detail.type-workout">Workout</option>
            <option value="meal" data-i18n="plan-detail.type-meal">Meal</option>
          </select>
        </label>
      </div>
    </div>
  </main>

  <footer class="footer"><span data-i18n="footer-plans">Vita Plans</span></footer>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script>
    (function(){
      var b=(typeof window.API_BASE==='string'&&window.API_BASE)||location.origin;
      try{ b=new URL(b,location.href).origin; }catch(e){ b=location.origin; }
      window.API_BASE=String(b).replace(/\/+$/,'');
    })();
    function api(path){ return window.API_BASE + path; }

    const planId = new URLSearchParams(window.location.search).get("id");
    if (!planId) { alert("Missing plan ID in URL"); location.href = "plans.html"; }

    async function loadPlan() {
      try {
        const res = await fetch(api(`/api/plans/${planId}`));
        if (!res.ok) throw new Error("Plan not found");
        const plan = await res.json();
        document.getElementById("plan_name").value = plan.name || "";
        document.getElementById("plan_description").value = plan.description || "";
        document.getElementById("plan_type").value = plan.type || "workout";
        document.getElementById("plan-name-title").textContent = plan.name || "Plan Detail";
      } catch (err) {
        alert("Failed to load plan details.");
        location.href = "plans.html";
      }
    }

    async function savePlan() {
      const payload = {
        name: document.getElementById("plan_name").value.trim(),
        description: document.getElementById("plan_description").value.trim(),
        type: document.getElementById("plan_type").value.trim() || null
      };
      const res = await fetch(api(`/api/plans/${planId}`), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) { alert("✅ Saved"); location.href = "plans.html"; }
      else { const t=await res.text(); alert("❌ Failed: " + t); }
    }

    async function deletePlan() {
      if (!confirm("Delete this plan?")) return;
      const res = await fetch(api(`/api/plans/${planId}`), { method: "DELETE" });
      if (res.ok) { alert("✅ Deleted"); location.href = "plans.html"; }
      else { const t=await res.text(); alert("❌ Failed: " + t); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPlan();
      document.getElementById('saveButton').addEventListener('click', (e)=>{ e.preventDefault(); savePlan(); });
      document.getElementById('deleteButton').addEventListener('click', (e)=>{ e.preventDefault(); deletePlan(); });
    });
  </script>
</body>
</html>
