<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Client Plan</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a id="nav-home" href="trainer_home.html"><span data-i18n="nav-home"></span></a>
      <a id="nav-clients" href="clients.html"><span data-i18n="nav-clients"></span></a>
      <a id="nav-plans" class="active" href="plans.html"><span data-i18n="nav-plans"></span></a>
      <a id="nav-settings" href="settings.html"><span data-i18n="nav-settings"></span></a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Client Plan</div>
        <div class="card-sub">Assign and review the latest plan</div>
      </div>
      <a class="btn" href="clients.html">⬅ Back</a>
    </div>

    <div class="kv">
      <label>Client</label><div class="value" id="client-name">—</div>
      <label>Current Plan</label><div class="value" id="plan-name">—</div>
      <label>Type</label><div class="value" id="plan-type">—</div>
      <label>Assigned On</label><div class="value" id="assigned-on">—</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-sub">Description</div>
      <div id="plan-description" class="muted"></div>
    </div>

    <div class="row" style="gap:12px;margin-top:16px">
      <select id="plan-select"></select>
      <button class="btn" id="assign-plan-btn">Assign Plan</button>
    </div>
  </section>

  <section class="card">
    <div class="card-header"><div class="card-title">Plan History</div></div>
    <ul id="plan-history" class="list"></ul>
  </section>
</main>

<footer class="footer">Vita</footer>

<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/theme.js"></script>
<script>
(function(){var b=(typeof window.API_BASE==='string'&&window.API_BASE)||location.origin;try{var u=new URL(b,location.href);b=u.origin;}catch(e){b=location.origin}window.API_BASE=String(b).replace(/\/+$/,'')})();
function buildApiUrl(p){return window.API_BASE.replace(/\/+$/,'')+p}
const clientId=new URLSearchParams(location.search).get('id');
if(!clientId) location.href='clients.html';
async function loadClient(){const r=await fetch(buildApiUrl(`/api/clients/${clientId}`));if(!r.ok)throw 0;const c=await r.json();document.getElementById('client-name').textContent=c.full_name||'—'}
async function loadCurrentPlan(){const r=await fetch(buildApiUrl(`/api/client_plans/${clientId}`));if(!r.ok){document.getElementById('plan-name').textContent='—';document.getElementById('plan-type').textContent='—';document.getElementById('plan-description').textContent='No plan assigned.';document.getElementById('assigned-on').textContent='—';return}const d=await r.json();document.getElementById('plan-name').textContent=d.plan?.name||'—';document.getElementById('plan-type').textContent=d.plan?.type||'—';document.getElementById('plan-description').textContent=d.plan?.description||'';document.getElementById('assigned-on').textContent=d.assigned_on?new Date(d.assigned_on).toLocaleDateString():'—'}
async function loadPlans(){const r=await fetch(buildApiUrl('/api/plans/'));if(!r.ok)return;const ps=await r.json();const s=document.getElementById('plan-select');s.innerHTML='<option value="">— Select plan —</option>';ps.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o)})}
async function loadHistory(){const r=await fetch(buildApiUrl(`/api/client_plans/${clientId}/history`));const list=document.getElementById('plan-history');list.innerHTML='';if(!r.ok){list.innerHTML='<li>Failed to load history</li>';return}const rows=await r.json();if(!rows.length){list.innerHTML='<li>No history</li>';return}rows.forEach(x=>{const li=document.createElement('li');li.textContent=`#${x.plan_id} · ${new Date(x.assigned_on).toLocaleDateString()}`;list.appendChild(li)})}
async function assignPlan(){const pid=document.getElementById('plan-select').value;if(!pid)return;const r=await fetch(buildApiUrl('/api/client_plans/'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:Number(clientId),plan_id:Number(pid)})});if(!r.ok){alert('Assign failed');return}await loadCurrentPlan();await loadHistory();alert('Assigned')}
window.addEventListener('DOMContentLoaded',()=>{loadClient();loadCurrentPlan();loadPlans();loadHistory();document.getElementById('assign-plan-btn').addEventListener('click',assignPlan)});
function setLanguage(l){I18N.switchLang(l,['common','clients'])}
I18N.init(['common','clients']);
</script>
</body>
</html>
