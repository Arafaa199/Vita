<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Client Detail</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a id="nav-home" href="trainer_home.html"><span data-i18n="nav-home"></span></a>
      <a id="nav-clients" class="active" href="clients.html"><span data-i18n="nav-clients"></span></a>
      <a id="nav-plans" href="plans.html"><span data-i18n="nav-plans"></span></a>
      <a id="nav-settings" href="settings.html"><span data-i18n="nav-settings"></span></a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="client-name">Client Detail</div>
        <div class="card-sub">Edit client profile, membership and plans</div>
      </div>
      <div class="row">
        <a class="btn" id="btn-back" href="clients.html">⬅ Back</a>
      </div>
    </div>

    <form id="client-form" class="grid cols-2 gap-4">
      <div>
        <label>Full Name</label>
        <input id="full_name" type="text" />
      </div>
      <div>
        <label>Phone</label>
        <input id="phone" type="tel" />
      </div>
      <div>
        <label>Email</label>
        <input id="email" type="email" />
      </div>
      <div>
        <label>Age</label>
        <input id="age" type="number" />
      </div>
      <div>
        <label>Weight (kg)</label>
        <input id="weight" type="number" step="0.1" />
      </div>
      <div>
        <label>Height (cm)</label>
        <input id="height" type="number" step="0.1" />
      </div>
      <div>
        <label>Goal</label>
        <select id="goal">
          <option value="">—</option>
          <option value="fat_loss">Fat Loss</option>
          <option value="muscle_gain">Muscle Gain</option>
          <option value="maintenance">Maintenance</option>
        </select>
      </div>
      <div class="col-span-2">
        <label>Notes</label>
        <textarea id="notes" rows="4"></textarea>
      </div>

      <div class="col-span-2 row" style="align-items:center;gap:16px">
        <label>Membership Active</label>
        <input id="membership_active" type="checkbox" />
        <label>Start</label>
        <input id="start_date" type="date" />
        <label>End</label>
        <input id="end_date" type="date" />
      </div>

      <div class="col-span-2 row" style="gap:12px">
        <button type="button" class="btn" id="saveButton">Save</button>
        <button type="button" class="btn danger" id="deleteButton">Delete</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="card-header">
      <div class="card-title">Assigned Plan</div>
    </div>
    <ul id="assigned-plans-list" class="list"></ul>
    <div class="row" style="gap:12px;margin-top:12px">
      <select id="plan-select"></select>
      <button class="btn" id="assign-plan-btn">Assign</button>
    </div>
  </section>

  <section class="card">
    <div class="card-header"><div class="card-title">Client Pictures</div></div>
    <div class="grid cols-2">
      <div class="center">
        <div class="card-sub">Before</div>
        <img id="before-pic" class="img" style="width:250px;height:250px;object-fit:cover;border-radius:12px;border:1px solid var(--border)"/>
        <input id="before-upload" type="file" accept="image/*">
        <div id="before-uploaded-date" class="muted"></div>
      </div>
      <div class="center">
        <div class="card-sub">After</div>
        <img id="after-pic" class="img" style="width:250px;height:250px;object-fit:cover;border-radius:12px;border:1px solid var(--border)"/>
        <input id="after-upload" type="file" accept="image/*">
        <div id="after-uploaded-date" class="muted"></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">Vita</footer>

<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/theme.js"></script>
<script>
(function(){var b=(typeof window.API_BASE==='string'&&window.API_BASE)||location.origin;try{var u=new URL(b,location.href);b=u.origin;}catch(e){b=location.origin}window.API_BASE=String(b).replace(/\/+$/,'')})();
function buildApiUrl(p){return window.API_BASE.replace(/\/+$/,'')+p}
const clientId=new URLSearchParams(location.search).get('id');
if(!clientId) location.href='clients.html';
async function uploadClientPhoto(label,file){if(!file||!clientId)return;const fd=new FormData();fd.append('client_id',clientId);fd.append('label',label);fd.append('file',file);const r=await fetch(buildApiUrl('/upload_photo/'),{method:'POST',body:fd});if(!r.ok)throw new Error('upload');const d=await r.json();return d.image_url}
function fill(c){document.getElementById('client-name').textContent=c.full_name||'Client';document.getElementById('full_name').value=c.full_name||'';document.getElementById('email').value=c.email||'';document.getElementById('phone').value=c.phone||'';document.getElementById('age').value=c.age??'';document.getElementById('weight').value=c.weight??'';document.getElementById('height').value=c.height??'';document.getElementById('goal').value=c.goal||'';document.getElementById('notes').value=c.notes||'';document.getElementById('membership_active').checked=!!c.membership_active;document.getElementById('start_date').value=c.start_date||'';document.getElementById('end_date').value=c.end_date||''}
async function loadClient(){const r=await fetch(buildApiUrl(`/api/clients/${clientId}`));if(!r.ok)throw new Error('load client');fill(await r.json())}
async function saveChanges(){const body={full_name:document.getElementById('full_name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,age:parseInt(document.getElementById('age').value||'0'),weight:parseFloat(document.getElementById('weight').value||'0'),height:parseFloat(document.getElementById('height').value||'0'),goal:document.getElementById('goal').value,notes:document.getElementById('notes').value,membership_active:document.getElementById('membership_active').checked,start_date:document.getElementById('start_date').value,end_date:document.getElementById('end_date').value};const r=await fetch(buildApiUrl(`/api/clients/${clientId}`),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('update')}
async function deleteClient(){const r=await fetch(buildApiUrl(`/api/clients/${clientId}`),{method:'DELETE'});if(!r.ok)throw new Error('delete')}
async function loadPlans(){const r=await fetch(buildApiUrl('/api/plans/'));if(!r.ok)throw new Error('plans');const plans=await r.json();const s=document.getElementById('plan-select');s.innerHTML='<option value="">—</option>';plans.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o)})}
async function loadAssigned(){const r=await fetch(buildApiUrl(`/api/client_plans/${clientId}/history`));if(!r.ok)throw new Error('history');const rows=await r.json();const ul=document.getElementById('assigned-plans-list');ul.innerHTML='';rows.forEach(x=>{const li=document.createElement('li');li.textContent=`#${x.plan_id} · ${new Date(x.assigned_on).toLocaleDateString()}`;ul.appendChild(li)})}
async function assignPlan(){const pid=document.getElementById('plan-select').value;if(!pid)return;const r=await fetch(buildApiUrl('/api/client_plans/'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:Number(clientId),plan_id:Number(pid)})});if(!r.ok)throw new Error('assign');await loadAssigned()}

window.addEventListener('DOMContentLoaded',()=>{
  loadClient().catch(()=>alert('Failed to load client'));
  loadPlans().catch(()=>alert('Failed to load plans'));
  loadAssigned().catch(()=>{});
  document.getElementById('assign-plan-btn').addEventListener('click',assignPlan);
  document.getElementById('saveButton').addEventListener('click',async()=>{try{await saveChanges();alert('Saved')}catch(e){alert('Save failed')}});
  document.getElementById('deleteButton').addEventListener('click',async()=>{if(!confirm('Delete client?'))return;try{await deleteClient();location.href='clients.html'}catch(e){alert('Delete failed')}});
  document.getElementById('before-upload').addEventListener('change',async(e)=>{const f=e.target.files[0];if(!f)return;try{const url=await uploadClientPhoto('before',f);if(url)document.getElementById('before-pic').src=url}catch{alert('Upload failed')}});
  document.getElementById('after-upload').addEventListener('change',async(e)=>{const f=e.target.files[0];if(!f)return;try{const url=await uploadClientPhoto('after',f);if(url)document.getElementById('after-pic').src=url}catch{alert('Upload failed')}});
});

function setLanguage(l){ I18N.switchLang(l, ['common','clients']); }
I18N.init(['common','clients']);
</script>
</body>
</html>
