<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Plans</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a id="nav-home" href="trainer_home.html" id="nav-home"><span data-i18n="nav-home"></span></a>
      <a id="nav-clients" href="clients.html" id="nav-clients"><span data-i18n="nav-clients"></span></a>
      <a id="nav-plans" class="active" href="plans.html" id="nav-plans"><span data-i18n="nav-plans"></span></a>
      <a id="nav-settings" href="settings.html" id="nav-settings"><span data-i18n="nav-settings"></span></a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="plans-title"><span data-i18n="plans-title"></span></div>
        <div class="card-sub" id="plans-description"><span data-i18n="plans-description"></span></div>
      </div>
      <div class="row">
        <a class="btn secondary" href="add_plan.html" id="add-plan"><span data-i18n="add-plan"></span></a>
      </div>
    </div>
    <!-- Plans list rendered by fetch_plan.js -->
    <ul class="grid cols-2" id="plan-list"></ul>
  </section>
</main>

<footer class="footer">Vita Plans</footer>
<script src="../js/i18n.js"></script>
<script src="../js/config.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/fetch_plan.js"></script>
<script>function setLanguage(l){ I18N.switchLang(l, ['common','plans']); }</script>
<script>I18N.init(['common','plans']);</script>
</body></html>
