<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Settings</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a href="trainer_home.html" id="nav-home"><span data-i18n="nav-home"></span></a>
      <a href="clients.html" id="nav-clients"><span data-i18n="nav-clients"></span></a>
      <a href="plans.html" id="nav-plans"><span data-i18n="nav-plans"></span></a>
      <a href="#" id="nav-progress"><span data-i18n="nav-progress"></span></a>
      <a href="settings.html" id="nav-settings" class="active"><span data-i18n="nav-settings"></span></a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')"><span data-i18n="lang-en"></span></button>
        <button class="btn ghost" onclick="setLanguage('ar')"><span data-i18n="lang-ar"></span></button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="welcome"><span data-i18n="welcome"></span></div>
        <div class="card-sub" id="subtitle"><span data-i18n="subtitle"></span></div>
      </div>
    </div>

    <form>
      <div class="form-row cols-2">
        <div>
          <label for="name" id="label-name"><span data-i18n="label-name"></span></label>
          <input type="text" id="name" placeholder="John Doe" />
        </div>
        <div>
          <label for="email" id="label-email"><span data-i18n="label-email"></span></label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
      </div>

      <div class="form-row cols-2">
        <div>
          <label for="phone" id="label-phone"><span data-i18n="label-phone"></span></label>
          <input type="text" id="phone" placeholder="+1234567890" />
        </div>
        <div>
          <label for="language" id="label-language"><span data-i18n="label-language"></span></label>
          <select id="language">
            <option value="en">English</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="row" style="gap:10px; align-items:center">
          <input type="checkbox" id="notifications" />
          <label for="notifications" id="label-notifications"><span data-i18n="label-notifications"></span></label>
        </div>
      </div>

      <div style="text-align:right">
        <button type="submit" class="btn secondary"><span data-i18n="button-save"></span></button>
      </div>
    </form>
  </section>
</main>

<footer class="footer">Vita Settings</footer>
<script src="../js/i18n.js"></script>
<script src="../js/config.js"></script>
<script src="../js/theme.js"></script>
<script>function setLanguage(l){ I18N.switchLang(l, ['common','settings']); }</script>
<script>I18N.init(['common','settings']);</script>
</body>
</html>
