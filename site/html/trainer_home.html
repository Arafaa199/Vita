<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a id="nav-home" class="active" id="nav-home" href="trainer_home.html"><span data-i18n="nav-home"></span></a>
      <a id="nav-clients" href="clients.html" id="nav-clients"><span data-i18n="nav-clients"></span></a>
      <a id="nav-plans" href="plans.html" id="nav-plans"><span data-i18n="nav-plans"></span></a>
      <a id="nav-settings" href="settings.html" id="nav-settings"><span data-i18n="nav-settings"></span></a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="grid cols-2">
    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title" id="quick-actions"><span data-i18n="quick-actions"></span></div>
          <div class="card-sub">Common tasks you do every day</div>
        </div>
      </div>
      <div class="chips">
        <a class="chip" href="add_client.html" id="add-client">+ Add Client</a>
        <a class="chip" href="add_plan.html" id="create-plan">+ New Plan</a>
        <a class="chip" href="#" id="view-progress">View Progress</a>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title" id="recent-activity"><span data-i18n="recent-activity"></span></div>
          <div class="card-sub" id="no-activity"><span data-i18n="no-activity"></span></div>
        </div>
      </div>
      <table class="table">
        <thead><tr><th>Time</th><th>Event</th><th>Client</th></tr></thead>
        <tbody>
          <tr><td>—</td><td>—</td><td>—</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</main>

<footer class="footer">Vita Trainer — built for speed and clarity</footer>
<script src="../js/i18n.js"></script>
<script src="../js/theme.js"></script>
<script>function setLanguage(l){ I18N.switchLang(l, ['common']); }</script>
<script>function setLanguage(l){ I18N.switchLang(l, ['common']); }</script>
<script>I18N.init(['common']);</script>
</body>
</html>
