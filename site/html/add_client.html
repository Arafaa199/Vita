<!doctype html><html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vita · Add Client</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="brand-badge"></div> Vita Trainer</div>
    <nav class="nav">
      <a href="trainer_home.html">Home</a>
      <a href="clients.html">Clients</a>
      <a href="plans.html">Plans</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="toolbar">
      <div class="lang-toggle">
        <button class="btn ghost" onclick="setLanguage('en')">EN</button>
        <button class="btn ghost" onclick="setLanguage('ar')">AR</button>
      </div>
      <button class="btn theme-toggle" data-theme-toggle>🌓</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="add-client-header">Add New Client</div>
        <div class="card-sub" id="add-client-subtext">Enter client details below</div>
      </div>
    </div>
    <form class="form">
      <div class="form-row cols-2">
        <div><label id="label-name">Full Name</label><input id="fullName" placeholder="Client's Full Name"></div>
        <div><label id="label-email">Email</label><input id="email" type="email" placeholder="client@example.com"></div>
      </div>
      <div class="form-row cols-2">
        <div><label id="label-phone">Phone Number</label><input id="phone" type="tel" placeholder="+9665XXXXXXX"></div>
        <div><label id="label-height">Height (cm)</label><input id="height" type="number" placeholder="e.g. 180"></div>
      </div>
      <div class="form-row cols-2">
        <div><label id="label-weight">Weight (kg)</label><input id="weight" type="number" placeholder="e.g. 85"></div>
        <div><label id="label-age">Age</label><input id="age" type="number" placeholder="25"></div>
      </div>
      <div class="form-row cols-2">
        <div>
          <label id="label-goal">Fitness Goal</label>
          <select id="goal">
            <option value="fat_loss">Fat Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
        <div><label id="label-membership-active">Membership Active</label><select id="membership_active"><option value="true">Active</option><option value="false">Inactive</option></select></div>
      </div>
      <div class="form-row cols-2">
        <div><label id="label-start-date">Start Date</label><input id="start_date" type="date"></div>
        <div><label id="label-end-date">End Date</label><input id="end_date" type="date"></div>
      </div>
      <div class="form-row cols-2">
        <div>
          <label id="label-membership-length">Membership Duration</label>
          <select id="membership_length">
            <option value="">Select Duration</option>
            <option value="1">1 Month</option>
            <option value="3">3 Months</option>
            <option value="6">6 Months</option>
            <option value="12">1 Year</option>
          </select>
        </div>
        <div style="align-self:end; text-align:right">
          <button id="submit-button" class="btn secondary" type="submit">Add Client</button>
        </div>
      </div>
    </form>
  </section>
</main>

<script src="../js/lang.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/fetch_client.js"></script>
</body></html>
